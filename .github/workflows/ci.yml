name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Fresh Linux install gets the correct native binaries (the WSL/Windows
      # rolldown mismatch only affects local dev, not CI).
      - run: pnpm install --frozen-lockfile

      - name: Typecheck (app + functions)
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build
